name: Rust Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: apftool

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: apftool

          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: apftool

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: apftool

          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: apftool.exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: apftool.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: clechasseur/rs-cargo@v2
        with:
          command: install
          args: cargo-dist

      - name: Build release
        uses: clechasseur/rs-cargo@v2
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          # Determine the correct artifact path based on target
          ARTIFACT_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"

          # Rename artifact with platform and architecture
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            OS="linux"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            OS="macos"
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            OS="windows"
          fi

          ARCH="${{ matrix.target }}"
          ARCH="${ARCH%%-*}"

          # Rename the artifact
          RENAMED_ARTIFACT="apftool-${OS}-${ARCH}$([[ "${{ matrix.os }}" == "windows-latest" ]] && echo ".exe")"
          cp "$ARTIFACT_PATH" "$RENAMED_ARTIFACT"
          echo "ASSET_PATH=$RENAMED_ARTIFACT" >> $GITHUB_ENV
          echo "ASSET_NAME=$RENAMED_ARTIFACT" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ env.ASSET_PATH }}
          asset_name: ${{ env.ASSET_NAME }}
          asset_content_type: application/octet-stream

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Release
        run: echo "Release ${{ github.ref }} published successfully"
